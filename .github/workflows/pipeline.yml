name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'

jobs:

  # ------------------------
  # 1) LINTER JOB (Lightweight)
  # ------------------------
  linter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Run linter
        run: |
          echo "Running linter..."
          # مثال (غيره حسب مشروعك)
          pip install flake8
          flake8 . || exit 1


  # ------------------------
  # 2) TRAIN JOB (Expensive GPU)
  # ------------------------
  train:
    runs-on: ubuntu-latest
    needs: linter

    # 🔥 Gatekeeper Logic هنا
    if: >
      needs.linter.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.message, '[run-train]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Simulate Training
        run: |
          echo "Training model on GPU..."
          # simulate failure (اختياري)
          # exit 1

      # ------------------------
      # 2.1 Upload logs on failure
      # ------------------------
      - name: Create error log
        if: failure()
        run: |
          echo "Training failed! Check logs." > error_logs.txt

      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: error-logs
          path: error_logs.txt

      # ------------------------
      # 2.2 Always cleanup
      # ------------------------
      - name: Cleanup resources
        if: always()
        run: |
          echo "Cleaning up temporary cloud volumes..."
